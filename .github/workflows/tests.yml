name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: ffmpeg (kayıt testi için)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Bağımlılıklar
        # pyglet / sounddevice gerekmez: testler ses donanımı ve OpenGL olmadan çalışır
        run: pip install numpy scipy onnxruntime pytest pyflakes
      - name: Lint
        run: python -m pyflakes beat.py structure.py audio_analyzer.py director.py palette.py config.py recorder.py settings_menu.py visualizer.py layers tools tests
      - name: Testler
        run: python -m pytest -v tests
